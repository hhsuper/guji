<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon 预览</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .preview-item {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .preview-item img, .preview-item svg {
      display: block;
      margin: 0 auto 10px;
    }
    .label {
      font-size: 14px;
      color: #666;
    }
    .color-options {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .color-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.2s;
    }
    .color-btn:hover {
      transform: scale(1.05);
    }
    .instructions {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 30px;
    }
    .instructions h3 {
      margin-top: 0;
    }
    .instructions code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>咕叽 Favicon 预览</h1>

  <div class="color-options">
    <button class="color-btn" onclick="changeColor('indigo')" style="background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white;">靛蓝紫</button>
    <button class="color-btn" onclick="changeColor('blue')" style="background: linear-gradient(135deg, #3b82f6, #06b6d4); color: white;">天空蓝</button>
    <button class="color-btn" onclick="changeColor('green')" style="background: linear-gradient(135deg, #10b981, #34d399); color: white;">薄荷绿</button>
    <button class="color-btn" onclick="changeColor('orange')" style="background: linear-gradient(135deg, #f59e0b, #f97316); color: white;">活力橙</button>
    <button class="color-btn" onclick="changeColor('pink')" style="background: linear-gradient(135deg, #ec4899, #f472b6); color: white;">俏皮粉</button>
  </div>

  <div class="preview-grid" id="previews"></div>

  <div class="instructions">
    <h3>生成 ICO 文件</h3>
    <p>1. 右键点击下方大图标 → 另存为图片</p>
    <p>2. 或使用在线工具：<a href="https://realfavicongenerator.net/" target="_blank">RealFaviconGenerator</a></p>
    <p>3. 或运行 <code>npm install sharp</code> 后执行生成脚本</p>
  </div>

  <script>
    const colors = {
      indigo: { start: '#6366f1', end: '#8b5cf6', accent: '#fbbf24' },
      blue: { start: '#3b82f6', end: '#06b6d4', accent: '#fbbf24' },
      green: { start: '#10b981', end: '#34d399', accent: '#fbbf24' },
      orange: { start: '#f59e0b', end: '#f97316', accent: '#ffffff' },
      pink: { start: '#ec4899', end: '#f472b6', accent: '#fbbf24' }
    };

    let currentColor = 'indigo';

    function createSVG(size, color) {
      const c = colors[color];
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="${size}" height="${size}">
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${c.start}"/>
            <stop offset="100%" stop-color="${c.end}"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bg)"/>
        <text x="14" y="23" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle">估</text>
        <circle cx="26" cy="8" r="4" fill="${c.accent}" opacity="0.95"/>
        <circle cx="24.5" cy="6" r="1.5" fill="${c.accent}" opacity="0.5"/>
        <circle cx="28" cy="5" r="2" fill="${c.accent}" opacity="0.7"/>
      </svg>`;
    }

    function renderPreviews() {
      const sizes = [16, 32, 48, 64, 128, 180];
      const container = document.getElementById('previews');
      container.innerHTML = sizes.map(size => `
        <div class="preview-item">
          ${createSVG(size, currentColor)}
          <span class="label">${size}×${size}</span>
        </div>
      `).join('');
    }

    function changeColor(color) {
      currentColor = color;
      renderPreviews();
    }

    renderPreviews();
  </script>
</body>
</html>
